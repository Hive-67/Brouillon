<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personnage · Cartes</title><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;position:relative}
button::after{content:"";position:absolute;inset:-8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--bg:#120d0b;--hi:#ff8a3d;--lo:#4a1608;--glow:#ffd9a0;--txt:#fbf3ea;--mut:#b9a99a;--paper:#1d1512}
body{background:radial-gradient(1000px 700px at 50% 45%,color-mix(in srgb,var(--lo) 70%,transparent),transparent 72%),var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;min-height:100%}
.app{max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 22px 22px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--glow),var(--hi) 45%,var(--lo));box-shadow:0 0 30px -4px var(--hi)}
h1{font-size:22px;font-weight:800;letter-spacing:.3px}header small{color:var(--mut);display:block;font-size:13px}
.tabs{margin-left:auto;display:flex;gap:4px}.tabs button{padding:10px 16px;font-size:14px;color:var(--mut);border-radius:14px}.tabs .on{color:var(--txt);background:#ffffff12}
.stage{display:grid;grid-template-columns:1fr 280px 1fr;gap:18px;align-items:start}
.col{display:grid;gap:12px}
.col h2{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.5px}
.card3{position:relative;display:grid;grid-template-columns:1fr;border-radius:26px;overflow:hidden;min-height:132px;text-align:left;background:var(--paper);border:1px solid #ffffff14;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;box-shadow:0 20px 40px -24px #000}
.card3:active{transform:scale(.98)}
.card3 .ic{position:absolute;inset:0;display:grid;place-items:center;color:#fff3;background:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--hi) 55%,transparent),transparent 60%),linear-gradient(135deg,#3a1d12,#140c09)}
.card3 .ic svg{width:120px;height:120px;transform:rotate(-8deg) translateX(30px)}
.card3 .tx{position:relative;align-self:end;padding:14px 16px;background:linear-gradient(0deg,#0009,#0000);width:100%}
.card3 strong{font-size:18px;font-weight:600}.card3 small{display:block;font-size:12px;color:var(--glow);opacity:.85}
.perks,.mods{position:absolute;top:12px;right:12px;display:flex;gap:5px}
.perks u,.mods u{width:11px;height:11px;border-radius:50%;background:#ffffff30;display:block}.perks u:first-child,.mods u:nth-child(-n+3){background:var(--glow)}
.card3.ex{border-color:#e9c46a99;box-shadow:0 0 0 1px #e9c46a66,0 20px 50px -20px #e9c46a66}
.card3.ex .ic{background:radial-gradient(circle at 80% 20%,#e9c46a99,transparent 60%),linear-gradient(135deg,#4a3410,#140c09)}
.armor{display:grid;gap:10px}.armor .card3{min-height:84px}.armor .card3 .ic svg{width:70px;height:70px}
.mid{display:grid;justify-items:center;gap:12px;text-align:center}
.sun{position:relative;width:240px;height:240px;border-radius:50%;display:grid;place-content:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--glow) 60%,transparent),color-mix(in srgb,var(--hi) 35%,transparent) 45%,transparent 70%);}
.sun::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hi) 60%,transparent)}
.sun b{font-size:78px;font-weight:800;line-height:.9;text-shadow:0 0 40px var(--hi)}.sun span{font-size:13px;color:var(--glow);letter-spacing:2px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stb{background:var(--paper);border-radius:18px;padding:10px;display:grid;gap:6px;border:1px solid #ffffff10}
.stb .n{font-size:12px;color:var(--mut)}.stb b{font-size:22px;font-weight:600}.stb i{height:6px;border-radius:9px;background:#ffffff14;position:relative;overflow:hidden}.stb i::before{content:"";position:absolute;inset:0;width:calc(var(--v)*100%);background:linear-gradient(90deg,var(--hi),var(--glow));border-radius:9px}
.stb{text-align:left}.stb .n,.stb b,.stb i{display:block}
.chips{display:flex;gap:8px}.chip{padding:6px 14px;border-radius:12px;background:#ffffff10;font-weight:600;font-size:14px}.chip.on{background:var(--hi);color:#1a0a02}
.row7{display:flex;gap:7px}.at{width:30px;height:30px;border-radius:50%;background:#ffffff10;border:1px solid #ffffff1c}.at.on{background:var(--hi);box-shadow:0 0 14px -2px var(--hi)}
.diamond{width:40px;height:40px;transform:rotate(45deg);border-radius:10px;border:2px solid var(--hi);box-shadow:0 0 20px -2px var(--hi)}
.bar{display:flex;gap:10px;justify-content:center;position:sticky;bottom:10px}.bar button{padding:14px 22px;border-radius:18px;background:#ffffff12;font-weight:600}.bar .main{background:var(--hi);color:#1a0a02;box-shadow:0 12px 30px -12px var(--hi)}
@media (max-width:900px){.stage{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;order:-1}.tabs{display:none}}
@media (max-width:560px){.stage{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><div class="logo"></div><div><h1>Bunker Arsenal</h1><small>Chasseur · Solaire</small></div><nav class="tabs"><button class="on">Personnage</button><button>Construction</button><button>Coffre</button><button>Mes builds</button></nav></header><div class="stage"><div class="col"><h2>ARMES</h2><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 22 L28 10 L36 14 L12 28 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Fusil à impulsion</strong><small>Cinétique</small></span><span class="perks"><u></u><u></u></span></button><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 24 L30 8 L34 12 L10 28 Z M20 20 L28 30" fill="currentColor"/></svg></span><span class="tx"><strong>Fusil de précision</strong><small>Énergétique</small></span><span class="perks"><u></u><u></u></span></button><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20 L16 12 L34 12 L34 18 L16 26 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Lance-roquettes</strong><small>Lourde</small></span><span class="perks"><u></u><u></u></span></button><h2>ARTEFACT</h2><div class="row7"><button class="at on" aria-label="Atout 1"></button><button class="at on" aria-label="Atout 2"></button><button class="at on" aria-label="Atout 3"></button><button class="at on" aria-label="Atout 4"></button><button class="at" aria-label="Atout 5"></button><button class="at" aria-label="Atout 6"></button><button class="at" aria-label="Atout 7"></button></div></div><div class="mid"><div class="diamond"></div><div class="sun"><b>1975</b><span>PUISSANCE</span></div><div class="chips"><span class="chip on">+2</span><span class="chip on">+4</span></div><div class="sg"><div class="stb"><span class="n">Armes</span><b>100</b><i style="--v:0.5"></i></div><div class="stb"><span class="n">Santé</span><b>70</b><i style="--v:0.35"></i></div><div class="stb"><span class="n">Classe</span><b>120</b><i style="--v:0.6"></i></div><div class="stb"><span class="n">Grenade</span><b>60</b><i style="--v:0.3"></i></div><div class="stb"><span class="n">Super</span><b>40</b><i style="--v:0.2"></i></div><div class="stb"><span class="n">Mêlée</span><b>90</b><i style="--v:0.45"></i></div></div></div><div class="col"><h2>ARMURE</h2><div class="armor"><button class="card3 ex"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 12 H32 L28 30 H12 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Casque</strong><small>exotique</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6 L34 20 L20 34 L6 20 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Gantelets</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 22 L28 10 L36 14 L12 28 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Plastron</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 24 L30 8 L34 12 L10 28 Z M20 20 L28 30" fill="currentColor"/></svg></span><span class="tx"><strong>Jambières</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="card3"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20 L16 12 L34 12 L34 18 L16 26 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Marque de classe</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button></div></div></div><div class="bar"><button>Essayer d'autres pièces</button><button class="main">Équiper en jeu</button><button>Envoyer</button></div></div></body></html>
