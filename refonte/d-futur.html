<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personnage · Futur</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&display=swap');
@property --hi{syntax:'<color>';inherits:true;initial-value:#ff8a3d}
@property --lo{syntax:'<color>';inherits:true;initial-value:#5a1a0c}
@property --glow{syntax:'<color>';inherits:true;initial-value:#ffd08a}
*{box-sizing:border-box;margin:0}html,body{height:100%}
:root{--bg:#05070a;--txt:#e8f0f6;--mut:#7f8d9a;--ease:cubic-bezier(.16,1,.3,1);transition:--hi .7s,--lo .7s,--glow .7s}
body[data-el=cryo]{--hi:#3fd0ff;--lo:#0b3a52;--glow:#c2f2ff}
body[data-el=abyssal]{--hi:#b574ff;--lo:#2c1052;--glow:#e6d2ff}
body[data-el=stase]{--hi:#7b8aff;--lo:#161c5c;--glow:#d0d4ff}
body[data-el=filobscur]{--hi:#4fe08a;--lo:#0c3d24;--glow:#c8f8dc}
body[data-el=prisme]{--hi:#e07bff;--lo:#25345e;--glow:#8ff3ff}
body{overflow-x:hidden;background:var(--bg);color:var(--txt);font-family:Oxanium,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;position:relative}
button::after{content:"";position:absolute;inset:-8px}
.bg{position:fixed;inset:0;background:radial-gradient(900px 620px at 50% 46%,color-mix(in srgb,var(--lo) 85%,transparent),transparent 70%),linear-gradient(180deg,#05070a,#080b10);}
.bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in srgb,var(--hi) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--hi) 9%,transparent) 1px,transparent 1px);background-size:44px 44px;mask:radial-gradient(circle at 50% 46%,#000,transparent 75%);opacity:0;transition:opacity 1.2s .1s}
.go .bg::before{opacity:1}
.scan{position:fixed;left:0;right:0;height:120px;top:-130px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--hi) 22%,transparent) 85%,var(--hi) 100%);opacity:0;pointer-events:none;z-index:5;mix-blend-mode:screen}
.go .scan{animation:sweep 13s linear infinite .2s}
@keyframes sweep{0%{top:-130px;opacity:0}2%{opacity:.9}12%{top:100%;opacity:0}100%{top:100%;opacity:0}}
.app{position:relative;max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 22px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;z-index:1}
.cn{position:fixed;width:34px;height:34px;border:2px solid var(--hi);opacity:0;transform:scale(1.6);transition:opacity .5s,transform .8s var(--ease);z-index:4;pointer-events:none}
.go .cn{opacity:.9;transform:none}.cn.a{top:12px;left:12px;border-right:0;border-bottom:0}.cn.b{top:12px;right:12px;border-left:0;border-bottom:0}.cn.c{bottom:12px;left:12px;border-right:0;border-top:0}.cn.d{bottom:12px;right:12px;border-left:0;border-top:0}
header{display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(-14px);transition:opacity .6s .15s,transform .8s .15s var(--ease)}
.go header{opacity:1;transform:none}
.logo{width:38px;height:38px;color:var(--hi);filter:drop-shadow(0 0 8px var(--hi))}
.logo path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-dasharray:140;stroke-dashoffset:140}
.go .logo path{animation:draw 1.2s .3s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}
h1{font-size:19px;font-weight:700;letter-spacing:3px}header small{display:block;color:var(--mut);font-size:12px;letter-spacing:1px}
.tabs{margin-left:auto;display:flex;gap:2px}.tabs button{padding:10px 18px;font-size:13px;letter-spacing:1.5px;color:var(--mut);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:color .25s,background .25s}
.tabs .on{background:var(--hi);color:#050505;font-weight:700}
.els{display:flex;gap:10px;margin-left:12px}.els button{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3px #ffffff30;transition:transform .3s var(--ease),box-shadow .3s}.els button::after{inset:-12px}
.els button.on{transform:scale(1.25);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--c),0 0 16px var(--c)}
main{display:grid;grid-template-columns:1fr minmax(0,540px) 1fr;gap:10px;align-items:center}
.col{display:grid;gap:9px;align-content:center}
.col h2{font-size:12px;font-weight:600;letter-spacing:3px;color:var(--hi);opacity:0;transition:opacity .6s .6s;display:flex;align-items:center;gap:8px}
.col h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hi),transparent);transform:scaleX(0);transform-origin:left;transition:transform .9s .7s var(--ease)}
.go .col h2{opacity:1}.go .col h2::after{transform:none}
.unit{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;width:100%;text-align:left;background:linear-gradient(90deg,color-mix(in srgb,var(--hi) 10%,#0b1016),#0b1016dd);border:1px solid #ffffff14;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);opacity:0;transform:translateX(calc(var(--d,-1)*34px));transition:opacity .6s,transform .9s var(--ease),border-color .25s,background .25s;transition-delay:calc(.55s + var(--i)*80ms),calc(.55s + var(--i)*80ms),0s,0s}
.R .unit{--d:1}
.go .unit{opacity:1;transform:none}
.unit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hi);box-shadow:0 0 12px var(--hi);transform:scaleY(0);transition:transform .35s var(--ease)}
.unit:hover::before,.unit.sel::before{transform:none}
.unit.sel{border-color:color-mix(in srgb,var(--hi) 70%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--hi) 24%,#0b1016),#0b1016dd)}
.unit:active{transform:scale(.98);transition-duration:.12s}
.unit .ic{width:46px;height:46px;display:grid;place-items:center;flex:none;color:var(--hi);border:1px solid color-mix(in srgb,var(--hi) 50%,transparent);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--hi) 28%,transparent),transparent 70%)}
.unit .ic svg{width:26px;height:26px;filter:drop-shadow(0 0 6px var(--hi))}
.unit.ex .ic{color:#ffd76a;border-color:#ffd76a99}.unit.ex{border-color:#ffd76a66}
.tx{display:grid;gap:1px}.tx strong{font-size:14px;font-weight:600;letter-spacing:.4px}.tx small{font-size:11.5px;color:var(--mut);letter-spacing:1px}
.pips{margin-left:auto;display:flex;gap:4px}.pips u{width:8px;height:8px;background:#ffffff22;transform:rotate(45deg);display:block}
.pips u.on{background:var(--glow);box-shadow:0 0 8px var(--glow);animation:blink 2.8s calc(var(--k)*.35s) infinite}
@keyframes blink{0%,86%,100%{opacity:1}92%{opacity:.25}}
.row7{display:flex;gap:7px}.at{width:30px;height:30px;transform:rotate(45deg) scale(.78);border:1px solid color-mix(in srgb,var(--hi) 60%,transparent);transition:background .25s,box-shadow .25s}
.at.on{background:var(--hi);box-shadow:0 0 14px var(--hi)}
.core{position:relative;width:100%;aspect-ratio:1;opacity:0;transform:scale(.86);transition:opacity .8s .3s,transform 1.2s .3s var(--ease)}
.go .core{opacity:1;transform:none}
.core svg{width:100%;height:100%;overflow:visible}
.rg{fill:none;stroke:var(--hi)}
.r1{stroke-width:1.5;stroke-dasharray:2 7;opacity:.55;transform-box:fill-box;transform-origin:center;animation:spin 120s linear infinite}
.r2{stroke-width:2;stroke-dasharray:46 26 12 26;opacity:.7;transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite reverse}
.r3{stroke-width:1;opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}
.trk{fill:none;stroke:#ffffff14;stroke-width:14;stroke-linecap:butt}
.val{fill:none;stroke:var(--hi);stroke-width:14;stroke-dasharray:0 100;filter:drop-shadow(0 0 6px var(--hi));transition:stroke-dasharray 1.4s var(--ease);transition-delay:calc(1s + var(--i)*110ms)}
.go .val{stroke-dasharray:var(--p) 100}
.lab{fill:var(--mut);font-size:12px;letter-spacing:1.5px;text-anchor:middle}.num{fill:var(--txt);font-size:19px;font-weight:600;text-anchor:middle}
.radar{position:absolute;inset:25.5%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,color-mix(in srgb,var(--hi) 38%,transparent) 360deg);animation:spin 6s linear infinite;mask:radial-gradient(circle,transparent 58%,#000 59%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);opacity:.7}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.dm{width:16px;height:16px;margin:0 auto 6px;border:2px solid var(--glow);transform:rotate(45deg);box-shadow:0 0 14px var(--glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 24px var(--glow),0 0 0 4px color-mix(in srgb,var(--glow) 25%,transparent)}}
.pw{font-size:clamp(54px,9vw,78px);font-weight:700;line-height:1;color:var(--glow);text-shadow:0 0 28px var(--hi);letter-spacing:2px;font-variant-numeric:tabular-nums}
.pl{font-size:11px;letter-spacing:6px;color:var(--mut)}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px}.chip{padding:3px 11px;border:1px solid var(--hi);font-size:13px;color:var(--glow);background:color-mix(in srgb,var(--hi) 16%,transparent)}
.readout{min-height:44px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-left:3px solid var(--hi);background:linear-gradient(90deg,color-mix(in srgb,var(--hi) 12%,#0b1016),transparent);font-size:13px;letter-spacing:.8px;color:var(--glow);opacity:0;transition:opacity .6s 1.4s}
.go .readout{opacity:1}.readout::after{content:"▍";animation:caret 1s steps(1) infinite}@keyframes caret{50%{opacity:0}}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;position:sticky;bottom:10px}
.bar button{padding:13px 24px;border:1px solid color-mix(in srgb,var(--hi) 55%,transparent);background:#0b1016ee;font-weight:600;letter-spacing:1px;font-size:13px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .15s,background .25s}
.bar button:active{transform:scale(.96)}.bar .main{background:var(--hi);color:#050505;border:0;box-shadow:0 0 24px -4px var(--hi)}
.bar .ghost{color:var(--mut)}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.core{grid-column:1/-1;order:-1;max-width:520px;margin:0 auto}.tabs{display:none}}
@media (max-width:560px){main{grid-template-columns:minmax(0,1fr)}header{flex-wrap:wrap}.els{width:100%;justify-content:space-between;margin:0;padding:4px 6px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.scan{display:none}}
</style></head><body data-el="solaire"><div class="bg"></div><div class="scan"></div><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>
<div class="app"><header><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 2 H38 V30 L30 38 H2 V10 Z M14 14 L26 14 L26 26 L14 26 Z"/></svg><div><h1>BUNKER ARSENAL</h1><small>CHASSEUR · SOLAIRE</small></div>
<nav class="tabs"><button class="on">PERSONNAGE</button><button>CONSTRUCTION</button><button>COFFRE</button><button>MES BUILDS</button></nav>
<div class="els" id="els"></div></header>
<main><section class="col L"><h2>ARMES</h2><div id="armes" style="display:grid;gap:9px"></div><h2>ARTEFACT</h2><div class="row7" id="art"></div></section>
<section class="core"><svg viewBox="-260 -260 520 520" id="ring" aria-hidden="true"><circle class="rg r1" r="248"/><circle class="rg r2" r="232"/><circle class="rg r3" r="150"/></svg><div class="radar"></div>
<div class="mid"><div class="dm"></div><div class="pw" id="pw">0</div><div class="pl">PUISSANCE</div><div class="chips"><span class="chip">+2</span><span class="chip">+4</span></div></div></section>
<section class="col R"><h2>ARMURE</h2><div id="armure" style="display:grid;gap:9px"></div></section></main>
<div class="readout" id="ro"></div>
<div class="bar"><button class="ghost" id="replay">REJOUER L'INTRO</button><button>ESSAYER D'AUTRES PIÈCES</button><button class="main">ÉQUIPER EN JEU</button><button>ENVOYER</button></div></div>
<script>
const IC=["M4 22 L28 10 L36 14 L12 28 Z","M6 24 L30 8 L34 12 L10 28 Z M20 20 L28 30","M5 20 L16 12 L34 12 L34 18 L16 26 Z","M8 12 H32 L28 30 H12 Z","M20 6 L34 20 L20 34 L6 20 Z"];
const svg=i=>`<svg viewBox="0 0 40 40"><path d="${IC[i%5]}" fill="currentColor"/></svg>`;
const ARMES=[["Fusil à impulsion","Cinétique",2],["Fusil de précision","Énergétique",2],["Lance-roquettes","Lourde",2]];
const ARM=[["Casque","exotique",1],["Gantelets","légendaire",0],["Plastron","légendaire",0],["Jambières","légendaire",0],["Marque de classe","légendaire",0]];
const ST=[["ARMES",100],["SANTÉ",70],["CLASSE",120],["GRENADE",60],["SUPER",40],["MÊLÉE",90]];
const EL=[["solaire","#ff8a3d","SOLAIRE"],["cryo","#3fd0ff","CRYO-ÉLECTRIQUE"],["abyssal","#b574ff","ABYSSAL"],["stase","#7b8aff","STASE"],["filobscur","#4fe08a","FILOBSCUR"],["prisme","#e07bff","PRISMATIQUE"]];
const $=s=>document.querySelector(s);
const unit=(n,s,ic,pips,i,ex,on)=>`<button class="unit${ex?' ex':''}" style="--i:${i}" data-t="${n} · ${s}"><span class="ic">${svg(ic)}</span><span class="tx"><strong>${n}</strong><small>${s.toUpperCase()}</small></span><span class="pips">${Array.from({length:pips},(_,k)=>`<u class="${k<(pips==2?1:3)?'on':''}" style="--k:${k}"></u>`).join('')}</span></button>`;
$('#armes').innerHTML=ARMES.map((a,i)=>unit(a[0],a[1],i,2,i)).join('');
$('#armure').innerHTML=ARM.map((a,i)=>unit(a[0],a[1],i+3,5,i,a[2])).join('');
$('#art').innerHTML=Array.from({length:7},(_,i)=>`<button class="at${i<4?' on':''}" aria-label="Atout ${i+1}"></button>`).join('');
$('#els').innerHTML=EL.map((e,i)=>`<button style="--c:${e[1]}" data-e="${e[0]}" data-n="${e[2]}" class="${i?'':'on'}" aria-label="${e[2]}"></button>`).join('');
// anneau de statistiques
const P=(r,a)=>[r*Math.cos(a*Math.PI/180),r*Math.sin(a*Math.PI/180)];
let g='';
ST.forEach((s,i)=>{const a1=-120+i*60+4,a2=a1+52,[x1,y1]=P(170,a1),[x2,y2]=P(170,a2),d=`M${x1} ${y1} A170 170 0 0 1 ${x2} ${y2}`,mid=a1+26,[lx,ly]=P(202,mid);
g+=`<path class="trk" d="${d}" pathLength="100"/><path class="val" d="${d}" pathLength="100" style="--p:${s[1]/2};--i:${i}"/>`+
`<text class="lab" x="${lx}" y="${ly-4}">${s[0]}</text><text class="num" x="${lx}" y="${ly+16}" data-n="${s[1]}">0</text>`;});
$('#ring').insertAdjacentHTML('beforeend',g);
// compteurs
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function count(el,to,delay,dur){if(reduce){el.textContent=to;return}const t0=performance.now()+delay;(function f(t){const k=Math.min(1,Math.max(0,(t-t0)/dur)),e=k===1?1:1-Math.pow(2,-10*k);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(f)})(performance.now())}
// texte qui s'écrit
let tm;function type(s){clearInterval(tm);const ro=$('#ro');if(reduce){ro.firstChild?ro.firstChild.nodeValue=s:ro.prepend(s);return}let i=0;ro.textContent='';tm=setInterval(()=>{ro.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(tm)},16)}
function intro(){document.body.classList.remove('go');void document.body.offsetWidth;document.body.classList.add('go');
 count($('#pw'),1975,700,1600);document.querySelectorAll('.num').forEach((n,i)=>count(n,+n.dataset.n,1000+i*110,1100));
 setTimeout(()=>type('SYSTÈME PRÊT · CHASSEUR · SOLAIRE · 6 STATISTIQUES LUES'),1600)}
document.addEventListener('click',e=>{
 const u=e.target.closest('.unit');if(u){document.querySelectorAll('.unit.sel').forEach(x=>x.classList.remove('sel'));u.classList.add('sel');type('ANALYSE · '+u.dataset.t.toUpperCase()+' · EMPLACEMENTS LUS')}
 const d=e.target.closest('.els button');if(d){document.querySelectorAll('.els .on').forEach(x=>x.classList.remove('on'));d.classList.add('on');document.body.dataset.el=d.dataset.e;document.querySelector('header small').textContent='CHASSEUR · '+d.dataset.n;type('DOCTRINE · '+d.dataset.n+' · THÈME APPLIQUÉ')}
 const a=e.target.closest('.at');if(a)a.classList.toggle('on');
 if(e.target.closest('#replay'))intro();
});
addEventListener('load',()=>setTimeout(intro,80));
</script></body></html>
