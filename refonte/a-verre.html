<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personnage · Verre</title><style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;position:relative}
button::after{content:"";position:absolute;inset:-8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--bg:#0b0a10;--hi:#ff9a4d;--lo:#7a1f0f;--glow:#ffd27a;--txt:#f4efe9;--mut:#a79d96}
body{background:radial-gradient(900px 600px at 50% -10%,color-mix(in srgb,var(--lo) 80%,transparent),transparent 70%),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--hi) 22%,transparent),transparent 70%),radial-gradient(600px 500px at 0 90%,#2a1450aa,transparent 70%),var(--bg);color:var(--txt);font-family:Sora,system-ui,sans-serif;min-height:100%}
.app{max-width:1180px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 24px 24px;display:grid;gap:18px}
header{display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:0 8px 24px -6px var(--hi)}
header h1{font-size:18px;font-weight:700;letter-spacing:.2px}header small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.pills{margin-left:auto;display:flex;gap:6px;padding:5px;border-radius:999px;background:#ffffff0f;border:1px solid #ffffff1c;backdrop-filter:blur(18px)}
.pills button{padding:9px 16px;border-radius:999px;font-size:13px;color:var(--mut);transition:background .25s,color .25s}
.pills button.on{background:linear-gradient(135deg,var(--hi),var(--lo));color:#fff;box-shadow:0 6px 18px -6px var(--hi)}
main{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:18px}
.card{border-radius:30px;padding:20px;background:linear-gradient(160deg,#ffffff16,#ffffff08);border:1px solid #ffffff1f;backdrop-filter:blur(22px);box-shadow:0 30px 60px -30px #000c,inset 0 1px 0 #ffffff26}
.card h2{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:14px}
.list{display:grid;gap:10px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:#ffffff0d;border:1px solid #ffffff14;text-align:left;width:100%;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}
.it:active{transform:scale(.98)}
.it .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,color-mix(in srgb,var(--hi) 70%,#fff3),var(--lo));color:#fff;box-shadow:inset 0 1px 0 #fff5,0 8px 18px -8px var(--hi)}
.it .ic svg{width:28px;height:28px}
.it.ex .ic{background:linear-gradient(145deg,#ffe9a3,#c98a1a)}
.tx{display:grid;gap:2px}.tx strong{font-size:14px;font-weight:600}.tx small{font-size:12px;color:var(--mut)}
.perks,.mods{margin-left:auto;display:flex;gap:5px}
.perks u,.mods u{width:12px;height:12px;border-radius:50%;background:#ffffff26;display:block}
.perks u:first-child,.mods u:nth-child(-n+3){background:var(--glow);box-shadow:0 0 10px var(--glow)}
.hero{display:grid;gap:16px;align-content:start;text-align:center}
.ring{position:relative;width:210px;height:210px;margin:6px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:#ffffff14}.ring .fg{stroke:url(#g);stroke-dasharray:540;stroke-dashoffset:84;filter:drop-shadow(0 0 10px var(--hi))}
.ring div{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font-size:54px;font-weight:700;line-height:1;letter-spacing:-1px}.ring span{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;justify-content:center}.chip{padding:7px 14px;border-radius:999px;font-size:13px;background:#ffffff12;border:1px solid #ffffff1c;color:var(--mut)}.chip.on{color:#fff;background:linear-gradient(135deg,var(--hi),var(--lo))}
.st{display:grid;grid-template-columns:70px 1fr 38px;gap:10px;align-items:center;font-size:13px}
.st .n{text-align:left;color:var(--mut)}.st b{text-align:right;font-weight:600}
.st i{height:12px;border-radius:99px;background:#ffffff12;position:relative;overflow:hidden}
.st i::before{content:"";position:absolute;inset:0;width:calc(var(--v)*100%);border-radius:99px;background:linear-gradient(90deg,var(--lo),var(--hi),var(--glow));box-shadow:0 0 14px -2px var(--hi);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.row7{display:flex;gap:8px;margin-top:6px}.at{width:34px;height:34px;border-radius:12px;background:#ffffff12;border:1px solid #ffffff1c}.at.on{background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:0 0 14px -2px var(--hi)}
.super{width:46px;height:46px;border-radius:15px;transform:rotate(45deg);background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:0 10px 26px -6px var(--hi);margin:2px auto 0}
.dock{position:sticky;bottom:12px;display:flex;gap:10px;justify-content:center}
.dock button{padding:14px 22px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(18px);font-size:14px;font-weight:600}
.dock .main{background:linear-gradient(135deg,var(--hi),var(--lo));border:0;box-shadow:0 14px 30px -10px var(--hi)}
@media (max-width:900px){main{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1;order:-1}.pills{display:none}}
@media (max-width:560px){main{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><div class="logo"></div><div><h1>Bunker Arsenal</h1><small>Chasseur · Solaire</small></div><nav class="pills"><button class="on">Personnage</button><button>Construction</button><button>Coffre</button><button>Mes builds</button></nav></header><main><section class="card"><h2>Armes</h2><div class="list"><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 22 L28 10 L36 14 L12 28 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Fusil à impulsion</strong><small>Cinétique</small></span><span class="perks"><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 24 L30 8 L34 12 L10 28 Z M20 20 L28 30" fill="currentColor"/></svg></span><span class="tx"><strong>Fusil de précision</strong><small>Énergétique</small></span><span class="perks"><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20 L16 12 L34 12 L34 18 L16 26 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Lance-roquettes</strong><small>Lourde</small></span><span class="perks"><u></u><u></u></span></button></div><h2 style="margin-top:18px">Artefact</h2><div class="row7"><button class="at on" aria-label="Atout 1"></button><button class="at on" aria-label="Atout 2"></button><button class="at on" aria-label="Atout 3"></button><button class="at on" aria-label="Atout 4"></button><button class="at" aria-label="Atout 5"></button><button class="at" aria-label="Atout 6"></button><button class="at" aria-label="Atout 7"></button></div></section><section class="card hero"><div class="super" title="Doctrine"></div><div class="ring"><svg viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--lo)"/><stop offset=".6" stop-color="var(--hi)"/><stop offset="1" stop-color="var(--glow)"/></linearGradient></defs><circle class="bg" cx="100" cy="100" r="86"/><circle class="fg" cx="100" cy="100" r="86"/></svg><div><b>1975</b><span>Puissance</span></div></div><div class="chips"><span class="chip on">+2</span><span class="chip on">+4</span></div><div class="list"><div class="st"><span class="n">Armes</span><i style="--v:0.5"></i><b>100</b></div><div class="st"><span class="n">Santé</span><i style="--v:0.35"></i><b>70</b></div><div class="st"><span class="n">Classe</span><i style="--v:0.6"></i><b>120</b></div><div class="st"><span class="n">Grenade</span><i style="--v:0.3"></i><b>60</b></div><div class="st"><span class="n">Super</span><i style="--v:0.2"></i><b>40</b></div><div class="st"><span class="n">Mêlée</span><i style="--v:0.45"></i><b>90</b></div></div></section><section class="card"><h2>Armure</h2><div class="list"><button class="it ex"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 12 H32 L28 30 H12 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Casque</strong><small>exotique</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6 L34 20 L20 34 L6 20 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Gantelets</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 22 L28 10 L36 14 L12 28 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Plastron</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 24 L30 8 L34 12 L10 28 Z M20 20 L28 30" fill="currentColor"/></svg></span><span class="tx"><strong>Jambières</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20 L16 12 L34 12 L34 18 L16 26 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Marque de classe</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button></div></section></main><div class="dock"><button>Essayer d'autres pièces</button><button class="main">Équiper en jeu</button><button>Envoyer</button></div></div></body></html>
