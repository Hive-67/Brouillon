<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personnage · HUD</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;position:relative}
button::after{content:"";position:absolute;inset:-8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--bg:#07090c;--hi:#ff9a4d;--lo:#5a1a0c;--glow:#ffcf8a;--txt:#ecf1f5;--mut:#8996a3;--ln:#ff9a4d55}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--lo) 55%,#000),var(--bg) 55%);color:var(--txt);font-family:Oxanium,system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.app{position:relative;max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 22px 22px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ln);padding-bottom:12px}
.logo{width:34px;height:34px;clip-path:polygon(25% 0,100% 0,100% 75%,75% 100%,0 100%,0 25%);background:var(--hi)}
h1{font-size:19px;font-weight:700;letter-spacing:1px}header small{display:block;color:var(--mut);font-size:12px}
.tabs{margin-left:auto;display:flex;gap:2px}.tabs button{padding:10px 16px;font-size:14px;color:var(--mut);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}.tabs .on{background:var(--hi);color:#160803;font-weight:700}
main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.pan{position:relative;padding:16px;background:#0d1218cc;border:1px solid var(--ln);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.pan h2{font-size:12px;font-weight:600;color:var(--hi);letter-spacing:2px;margin-bottom:12px}
.list{display:grid;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:8px 10px;width:100%;text-align:left;border:1px solid #ffffff18;background:#ffffff08;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.it .ic{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(145deg,var(--hi),var(--lo));color:#160803;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.it .ic svg{width:26px;height:26px}
.it.ex{border-color:#e9c46a}.it.ex .ic{background:linear-gradient(145deg,#ffe9a3,#b8860b)}
.tx{display:grid}.tx strong{font-size:14px;font-weight:600}.tx small{font-size:12px;color:var(--mut)}
.perks,.mods{margin-left:auto;display:flex;gap:4px}.perks u,.mods u{width:8px;height:8px;background:#ffffff2a;display:block;transform:rotate(45deg)}.perks u:first-child,.mods u:nth-child(-n+3){background:var(--glow)}
.hero{display:grid;gap:14px;text-align:center;align-content:start}
.pw b{font-size:84px;font-weight:700;line-height:1;color:var(--glow);letter-spacing:2px}.pw span{display:block;color:var(--mut);font-size:12px;letter-spacing:4px}
.st{display:grid;grid-template-columns:64px 1fr 36px;gap:8px;align-items:center;font-size:13px}.st .n{text-align:left;color:var(--mut)}.st b{text-align:right}
.st i{height:10px;background:repeating-linear-gradient(90deg,#ffffff14 0 8px,transparent 8px 10px);position:relative}
.st i::before{content:"";position:absolute;inset:0;width:calc(var(--v)*100%);background:repeating-linear-gradient(90deg,var(--hi) 0 8px,transparent 8px 10px)}
.chips{display:flex;gap:6px;justify-content:center}.chip{padding:5px 12px;border:1px solid var(--ln);font-size:14px}.chip.on{background:var(--hi);color:#160803;font-weight:700}
.row7{display:flex;gap:6px;margin-top:12px}.at{width:30px;height:30px;transform:rotate(45deg) scale(.8);border:1px solid var(--ln)}.at.on{background:var(--hi)}
.diamond{width:26px;height:26px;transform:rotate(45deg);background:var(--hi);margin:0 auto}
.bar{display:flex;gap:10px;justify-content:center;position:sticky;bottom:10px}.bar button{padding:13px 22px;border:1px solid var(--ln);background:#0d1218;font-weight:600;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}.bar .main{background:var(--hi);color:#160803;border:0}
@media (max-width:900px){main{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1;order:-1}.tabs{display:none}}
@media (max-width:560px){main{grid-template-columns:1fr}}

yle="--v:0.35"></i><b>70</b></div><div class="st"><span class="n">Classe</span><i style="--v:0.6"></i><b>120</b></div><div class="st"><span class="n">Grenade</span><i style="--v:0.3"></i><b>60</b></div><div class="st"><span class="n">Super</span><i style="--v:0.2"></i><b>40</b></div><div class="st"><span class="n">Mêlée</span><i style="--v:0.45"></i><b>90</b></div></div></section><section class="pan"><h2>ARMURE</h2><div class="list"><button class="it ex"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 12 H32 L28 30 H12 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Casque</strong><small>exotique</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6 L34 20 L20 34 L6 20 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Gantelets</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 22 L28 10 L36 14 L12 28 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Plastron</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 24 L30 8 L34 12 L10 28 Z M20 20 L28 30" fill="currentColor"/></svg></span><span class="tx"><strong>Jambières</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button><button class="it"><span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20 L16 12 L34 12 L34 18 L16 26 Z" fill="currentColor"/></svg></span><span class="tx"><strong>Marque de classe</strong><small>légendaire</small></span><span class="mods"><u></u><u></u><u></u><u></u><u></u></span></button></div></section></main><div class="bar"><button>Essayer
