<style>
:root{
  --fond:#f2f2f7; --verre:rgba(242,242,247,.86); --carte:#fff; --encre:#1c1c1e; --doux:#6e6e73;
  --ligne:rgba(60,60,67,.16); --bleu:#0a6cff; --pilule:#e6efff; --marge:18px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--fond:#0f0f14; --verre:rgba(15,15,20,.86); --carte:#1c1c22; --encre:#f5f5f7; --doux:#9a9aa3;
    --ligne:rgba(255,255,255,.12); --bleu:#4c9bff; --pilule:#24314f}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:var(--fond)}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--encre);background:var(--fond);min-height:100dvh;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px);
}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px;border-radius:12px}

/* En-tête */
.haut{
  position:sticky;top:0;z-index:5;background:var(--verre);
  padding-top:env(safe-area-inset-top);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
}
.marque{
  display:flex;align-items:center;gap:10px;max-width:1200px;margin:0 auto;
  padding:12px max(var(--marge),env(safe-area-inset-right)) 6px max(var(--marge),env(safe-area-inset-left));
}
.marque svg{width:32px;height:32px;border-radius:22%;flex:none}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
#installer{
  margin-left:auto;min-height:36px;padding:0 16px;border:0;border-radius:999px;
  background:var(--bleu);color:#fff;font-weight:700;font-size:14px;cursor:pointer;
}
#installer[hidden]{display:none}
.rayons{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto;
  padding:4px max(var(--marge),env(safe-area-inset-right)) 10px max(var(--marge),env(safe-area-inset-left));
}
.rayons::-webkit-scrollbar{display:none}
.rayon{
  flex:none;min-height:40px;padding:0 16px;border:0;border-radius:999px;
  background:var(--carte);font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--ligne);
}
.rayon:active{opacity:.7}
.rayon[aria-pressed="true"]{background:var(--encre);color:var(--fond);box-shadow:none}

main{max-width:1200px;margin:0 auto}
.astuce{
  display:flex;align-items:center;gap:10px;margin:8px var(--marge) 0;padding:6px 6px 6px 14px;
  border-radius:16px;background:var(--pilule);font-size:14px;line-height:1.35;
}
.astuce[hidden]{display:none}
.astuce button{margin-left:auto;flex:none;min-width:44px;min-height:44px;border:0;background:transparent;font-size:18px;cursor:pointer}

/* À la une */
.une{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:8px var(--marge) 4px;
}
.une::-webkit-scrollbar{display:none}
.une-carte{
  position:relative;flex:0 0 min(80vw,340px);scroll-snap-align:start;aspect-ratio:16/10;
  border-radius:20px;overflow:hidden;color:#fff;
  background:linear-gradient(160deg,var(--a),var(--b));
  box-shadow:0 8px 20px -12px rgba(0,0,0,.5);
}
.une-carte:active{opacity:.9}
.une-carte img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.une-carte .voile{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.une-carte .txt{position:absolute;left:14px;right:84px;bottom:12px}
.une-carte h3{font-size:19px;font-weight:800;line-height:1.1}
.une-carte p{font-size:12.5px;line-height:1.25;opacity:.88;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.une-carte .jouer{position:absolute;right:12px;bottom:14px;background:#fff;color:#0a6cff}

/* Listes façon store */
.rang h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:24px var(--marge) 2px}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px;padding:0 var(--marge)}
.ligne{
  display:flex;align-items:center;gap:14px;padding:11px 0;min-width:0;
  border-bottom:1px solid var(--ligne);
}
.ligne:active{opacity:.6}
.icone{
  position:relative;flex:none;width:60px;height:60px;border-radius:22.5%;overflow:hidden;
  background:linear-gradient(160deg,var(--a),var(--b));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
}
.icone svg,.icone img{position:absolute;inset:0;width:100%;height:100%}
.icone img{object-fit:cover}
.icone.dedans img{object-fit:contain;padding:8%}
.infos{flex:1;min-width:0}
.infos h3{font-size:16px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:6px;min-width:0}
.infos h3 span.nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.infos p{
  font-size:13px;line-height:1.3;color:var(--doux);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tag{flex:none;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:#ffe9b0;color:#6b4a00}
.jouer{
  flex:none;display:inline-block;padding:7px 18px;border-radius:999px;
  background:var(--pilule);color:var(--bleu);font-weight:800;font-size:14px;line-height:1.2;
}

/* Tablette 10 pouces */
@media (min-width:700px){
  :root{--marge:28px}
  h1{font-size:34px}
  .icone{width:68px;height:68px}
  .liste{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));column-gap:36px}
  .une-carte{flex-basis:360px}
  .infos h3{font-size:17px}
}
@media (hover:hover){
  .ligne:hover .jouer{background:var(--bleu);color:#fff}
  .rayon:hover{opacity:.8}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-transparency:reduce){.haut{background:var(--fond)}}
@media (prefers-contrast:more){.ligne{border-bottom-color:var(--encre)}.infos p{color:var(--encre)}}
</style>
</head>

<script>
/* Lancement : l'aperçu de la branche du jeu (jamais le lien de publication). */
const base = id => `https://jeux-${id}--hiveostools.netlify.app/jeux/${id}/`;
const img = (id, f) => `img/${id}/${f.split('/').pop()}`;

/* icon = vraie icône du jeu, hero = vraie image large. Sans image : jaquette dessinée (ART). */
const G = [

  {id:'echecs', nom:'Échecs', sous:'La partie classique, pion après pion', cat:'Cartes et plateau', a:'#f0d9b5', b:'#b58863', icon:'icone-180.png'},
  {id:'neromath', nom:'NéroMath', sous:'Course aux calculs avec Néro le robot', cat:'Apprendre', a:'#ff9ecb', b:'#7b61ff', icon:'images/nero-face.webp', fit:'dedans'},

  'tetris': () => S(bl(48,48,'#3dd9ff')+bl(76,48,'#3dd9ff')+bl(104,48,'#3dd9ff')+bl(76,76,'#3dd9ff')+bl(160,20,'#4cf08a')+bl(160,48,'#4cf08a')+bl(160,76,'#4cf08a')+bl(160,104,'#4cf08a')+bl(20,132,'#ffd23f')+bl(48,132,'#ffd23f')+bl(20,160,'#ffd23f')+bl(48,160,'#ffd23f')+bl(104,132,'#ff6b9a')+bl(132,132,'#ff6b9a')+bl(76,160,'#ff6b9a')+bl(104,160,'#ff6b9a')),
  'bunker-boy': () => S(`<rect x="56" y="22" width="88" height="156" rx="14" fill="#cfd2e6"/><rect x="65" y="33" width="70" height="60" rx="7" fill="#12142b"/><rect x="71" y="39" width="58" height="48" rx="3" fill="#9bbc0f"/><path d="M88 52h6v6h-6zM106 52h6v6h-6zM82 58h6v6h-6zM112 58h6v6h-6zM88 64h24v6H88zM88 76h6v6h-6zM106 76h6v6h-6z" fill="#0f380f"/><rect x="72" y="124" width="26" height="9" rx="2" fill="#12142b"/><rect x="80.5" y="115.5" width="9" height="26" rx="2" fill="#12142b"/><circle cx="122" cy="122" r="9" fill="#ff3d6b"/><circle cx="108" cy="134" r="9" fill="#ff3d6b"/><rect x="76" y="156" width="20" height="6" rx="3" fill="#8a8fb0"/><rect x="104" y="156" width="20" height="6" rx="3" fill="#8a8fb0"/>`),
  'uno-maison': () => S(`<g transform="rotate(-26 100 175)"><rect x="70" y="52" width="60" height="92" rx="10" fill="#ffd23f" stroke="#fff" stroke-width="4"/></g><g transform="rotate(26 100 175)"><rect x="70" y="52" width="60" height="92" rx="10" fill="#4cf08a" stroke="#fff" stroke-width="4"/></g><rect x="70" y="52" width="60" height="92" rx="10" fill="#3d7bff" stroke="#fff" stroke-width="4"/>`+T(100,108,32,'+4','','#fff')),
  'pokebunker': () => S(`<g transform="rotate(-14 100 170)"><rect x="64" y="44" width="58" height="86" rx="9" fill="#fff"/>${T(93,92,36,'A','','#16123f')}${T(93,116,26,'♠','','#16123f')}</g><g transform="rotate(12 100 170)"><rect x="84" y="48" width="58" height="86" rx="9" fill="#fff"/>${T(113,96,36,'K','','#e63946')}${T(113,120,26,'♥','','#e63946')}</g><circle cx="150" cy="156" r="26" fill="#e63946"/><circle cx="150" cy="156" r="26" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 9"/><circle cx="150" cy="156" r="14" fill="none" stroke="#fff" stroke-width="2"/><circle cx="52" cy="164" r="22" fill="#3d7bff"/><circle cx="52" cy="164" r="22" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="9 8"/><circle cx="52" cy="164" r="12" fill="none" stroke="#fff" stroke-width="2"/>`),
  'echecs': () => {
    let b=''; for(let r=0;r<2;r++) for(let c=0;c<8;c++) if((r+c)%2===0) b+=`<rect x="${c*25}" y="${150+r*25}" width="25" height="25" fill="#16123f" opacity=".3"/>`;
    return S(b+`<circle cx="100" cy="68" r="19" fill="#16123f"/><rect x="82" y="88" width="36" height="9" rx="4.5" fill="#16123f"/><path d="M82 142Q86 104 100 100Q114 104 118 142Z" fill="#16123f"/><rect x="68" y="138" width="64" height="15" rx="6" fill="#16123f"/>`);
  },
  'neromath': () => S(`<path d="M100 72V50" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="44" r="7" fill="#ffd23f"/><rect x="46" y="96" width="10" height="26" rx="4" fill="#fff"/><rect x="144" y="96" width="10" height="26" rx="4" fill="#fff"/><rect x="56" y="72" width="88" height="78" rx="20" fill="#fff"/><circle cx="80" cy="104" r="11" fill="#16123f"/><circle cx="120" cy="104" r="11" fill="#16123f"/><circle cx="83" cy="101" r="3.5" fill="#fff"/><circle cx="123" cy="101" r="3.5" fill="#fff"/><rect x="82" y="126" width="36" height="9" rx="4.5" fill="#16123f"/><g stroke="#ffd23f" stroke-width="6" stroke-linecap="round"><path d="M30 36v20M20 46h20"/><path d="M160 40l20 20M180 40l-20 20"/><path d="M152 168h24M152 180h24"/><path d="M22 164h26"/></g>`),
  'nero-anglais-espace': () => S(`<g fill="#fff"><circle cx="28" cy="34" r="2.5"/><circle cx="60" cy="20" r="1.8"/><circle cx="176" cy="108" r="2.5"/><circle cx="22" cy="96" r="1.8"/><circle cx="168" cy="168" r="2"/><circle cx="40" cy="176" r="2.4"/></g><circle cx="96" cy="128" r="40" fill="#ff8a5b"/><path d="M70 112q26-12 52 0M64 132q32-12 64 0" stroke="#ffb08f" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="96" cy="128" rx="72" ry="14" fill="none" stroke="#ffd23f" stroke-width="6" transform="rotate(-18 96 128)"/><rect x="92" y="22" width="88" height="40" rx="16" fill="#fff"/><path d="M112 62l-6 14 20-14z" fill="#fff"/>`+T(136,50,24,'Hello','','#16123f')),
  'brickstudio': () => S(`<rect x="20" y="156" width="160" height="10" rx="5" fill="#16123f" opacity=".3"/><rect x="30" y="116" width="140" height="42" rx="5" fill="#e4334c"/><rect x="50" y="76" width="100" height="42" rx="5" fill="#2f6bff"/><rect x="70" y="36" width="60" height="42" rx="5" fill="#2fbf71"/><rect x="76" y="26" width="20" height="12" rx="5" fill="#2fbf71"/><rect x="104" y="26" width="20" height="12" rx="5" fill="#2fbf71"/><g fill="#fff" opacity=".3"><rect x="36" y="121" width="128" height="5" rx="2.5"/><rect x="56" y="81" width="88" height="5" rx="2.5"/><rect x="76" y="41" width="48" height="5" rx="2.5"/></g>`),
  'village-de-nolan': () => S(`<ellipse cx="168" cy="32" rx="22" ry="9" fill="#fff" opacity=".85"/><ellipse cx="28" cy="46" rx="18" ry="7" fill="#fff" opacity=".7"/><ellipse cx="100" cy="176" rx="60" ry="11" fill="#f2d49b"/><rect x="142" y="112" width="8" height="34" rx="3" fill="#8a5a2b"/><circle cx="146" cy="100" r="26" fill="#1f9d55"/><rect x="34" y="100" width="62" height="46" rx="4" fill="#fff7e0"/><path d="M26 102L65 62L104 102Z" fill="#e63946"/><rect x="56" y="116" width="18" height="30" rx="3" fill="#8a5a2b"/><rect x="40" y="110" width="12" height="12" rx="2" fill="#6ec5ff"/><rect x="80" y="110" width="12" height="12" rx="2" fill="#6ec5ff"/>`)
};

const fond = g => `--a:${g.a};--b:${g.b}${g.bg ? ';background:' + g.bg : ''}`;
/* Icône : le dessin en dessous, la vraie image par-dessus (le dessin s'efface quand l'image est là). */
const icone = g => `<div class="icone${g.fit ? ' ' + g.fit : ''}" style="${fond(g)}">${ART[g.id]()}${g.icon ? `<img src="${img(g.id, g.icon)}" alt="" loading="lazy" decoding="async" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()">` : ''}</div>`;
const ligne = g => `<a class="ligne" href="${base(g.id)}" aria-label="Jouer à ${g.nom}">${icone(g)}<div class="infos"><h3><span class="nom">${g.nom}</span>${g.badge ? `<span class="tag">${g.badge}</span>` : ''}</h3><p>${g.sous}</p></div><span class="jouer">Jouer</span></a>`;
const une = g => `<a class="une-carte" href="${base(g.id)}" aria-label="Jouer à ${g.nom}" style="--a:${g.a};--b:${g.b}"><img src="${img(g.id, g.hero)}" alt="" loading="lazy" decoding="async" onerror="this.remove()"><div class="voile"></div><div class="txt"><h3>${g.nom}</h3><p>${g.sous}</p></div><span class="jouer">Jouer</span></a>`;

let choix = 'Tous';
const $ = s => document.querySelector(s);

function dessinerRayons(){
  $('#rayons').innerHTML = ['Tous', ...RAYONS].map(r => `<button type="button" class="rayon" aria-pressed="${r === choix}" data-r="${r}">${r}</button>`).join('');
}
function dessiner(){
  let h = '';
  if (choix === 'Tous') {
    h += `<section class="une" aria-label="À la une">${UNE.map(id => une(G.find(g => g.id === id))).join('')}</section>`;
  }
  RAYONS.filter(r => choix === 'Tous' || r === choix).forEach(r => {
    const l = G.filter(g => g.cat === r);
    if (l.length) h += `<section class="rang"><h2>${r}</h2><div class="liste">${l.map(ligne).join('')}</div></section>`;
  });
  $('#contenu').innerHTML = h;
}
$('#rayons').addEventListener('click', e => {
  const b = e.target.closest('.rayon'); if (!b) return;
  choix = b.dataset.r; dessinerRayons(); dessiner(); window.scrollTo({top:0});
});
dessinerRayons(); dessiner();

/* Installation : bouton sur Android, petite astuce sur iPhone et iPad. */
let inst = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); inst = e; $('#installer').hidden = false; });
$('#installer').addEventListener('click', async () => {
  if (!inst) return; inst.prompt(); await inst.userChoice; inst = null; $('#installer').hidden = true;
});
window.addEventListener('appinstalled', () => { $('#installer').hidden = true; });

const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const installe = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let vu = false; try { vu = localStorage.getItem('nolangame-astuce') === '1'; } catch (e) {}
if (ios && !installe && !vu) $('#astuce').hidden = false;
$('#astuce-fermer').addEventListener('click', () => {
  $('#astuce').hidden = true; try { localStorage.setItem('nolangame-astuce', '1'); } catch (e) {}
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
